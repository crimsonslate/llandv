{% extends "portfolio/layout.html" %}
{% load wagtailcore_tags %}
{% block content %}
<h1 class="mb-8 font-semibold text-6xl md:mb-16 md:text-8xl">{{ page.title }}</h1>
<div class="mb-8 text-3xl text-pretty md:mb-16">{{ page.intro|richtext }}</div>
<div class="flex flex-col gap-8 md:gap-16">
    <form class="flex flex-col gap-16 text-xl [&_label]:text-4xl [&_label]:font-semibold [&_div]:flex [&_div]:flex-col [&_div]:gap-4 [&_input,&_textarea]:peer [&_input,&_textarea]:px-2 [&_input,&_textarea]:py-4 [&_input,&_textarea]:w-full [&_input,&_textarea]:bg-gray-600 [&_input,&_textarea]:border-y [&_input,&_textarea]:border-gray-500" action="{% pageurl page %}" method="post">
        {% csrf_token %}
        {{ form.as_div }}
        <button type="submit" class="font-semibold text-4xl py-8 px-4 bg-gray-800 transition-colors ease-in-out duration-300 cursor-pointer hover:bg-gray-500">submit</button>
    </form>
</div>
{% endblock content %}
