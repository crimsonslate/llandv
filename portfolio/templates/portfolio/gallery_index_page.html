{% extends "portfolio/layout.html" %}
{% load wagtailcore_tags wagtailimages_tags %}
{% block content %}
{% for page in galleries %}
    <a href="{% pageurl page %}">
        <div class="relative">
            {% image page.thumbnail max-2000x2000 class="max-h-96 w-full object-cover" %}
            <div class="p-4 -mx-4 absolute top-0 bg-gray-800 rounded-br">
                <p class="text-xl font-semibold text-gray-200">{{ page.title }}</p>
                <p class="text-lg text-gray-300">{{ page.pub_date|date|lower }}</p>
            </div>
        </div>
    </a>
{% endfor %}
{% endblock content %}
